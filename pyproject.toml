[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "A reliable agent evaluation harness with trajectory recording, automatic failure taxonomy tagging, and pass^k consistency metrics."
readme = "README.md"
authors = [{ name = "Ayush Mishra" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agent-eval = "agent_eval_harness.cli:main"
